name: Build APK
on:
  workflow_dispatch:
    inputs:
      name:
        description: App name
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build
        env:
          APP: ${{ inputs.name }}
        run: |
          mkdir work
          unzip -q "projects/$APP.zip" -d work
          S=$(find work -maxdepth 3 -name 'settings.gradle*' | head -1)
          if [ -z "$S" ]; then echo "No settings.gradle found in the zip"; exit 1; fi
          cd "$(dirname "$S")"
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ inputs.name }}
        run: |
          F=$(find work -path '*outputs*' -name '*.apk' | head -1)
          if [ -z "$F" ]; then echo "No APK was produced"; exit 1; fi
          cp "$F" "$APP.apk"
          gh release create "$APP-${{ github.run_number }}" "$APP.apk" --title "$APP #${{ github.run_number }}" --notes "Built with APK Maker"
